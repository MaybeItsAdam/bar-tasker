name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build package
        run: swift build

      - name: Run swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Report code coverage
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "${BIN_PATH}" -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            EXECUTABLE="${XCTEST_PATH}/Contents/MacOS/$(basename "${XCTEST_PATH}" .xctest)"
            COV_DIR=$(dirname "${BIN_PATH}")/codecov
            PROFDATA=$(find "${COV_DIR}" -name 'default.profdata' 2>/dev/null | head -1)
            if [ -n "$PROFDATA" ]; then
              xcrun llvm-cov report "${EXECUTABLE}" -instr-profile="${PROFDATA}" \
                -ignore-filename-regex='(Tests|\.build)'
            else
              echo "::warning::No profdata found — code coverage report skipped."
            fi
          else
            echo "::warning::No xctest bundle found — code coverage report skipped."
          fi

  macos-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Both configurations now sign with a real "Apple Development" identity so
      # local rebuilds keep a stable designated requirement (and stop
      # re-prompting for keychain access). CI runners have no such certificate
      # in their keychain, so signing has to be off here.
      - name: Build app (Debug)
        run: |
          xcodebuild -project 'Priority.xcodeproj' \
            -scheme 'Priority' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Release is the configuration that actually ships (scripts/build_dmg.sh)
      # and, unlike Debug, it enables the app sandbox with a different
      # entitlements file. Building only Debug meant sandbox-only breakage —
      # e.g. a missing entitlement for the OAuth loopback listener — reached
      # users without ever failing CI.
      - name: Build app (Release)
        run: |
          xcodebuild -project 'Priority.xcodeproj' \
            -scheme 'Priority' \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Guards the entitlements the app depends on at runtime, which a compile
      # alone cannot check.
      #
      # The sandbox is deliberately OFF and this asserts that it stays off.
      # Under the sandbox, keychain access is scoped to an access group that
      # comes from `com.apple.application-identifier`, which only an embedded
      # provisioning profile grants — and the project signs manually with none.
      # The sandboxed build therefore had no access group, every `SecItemAdd`
      # failed, and the app silently forgot the Checkvist remote key on every
      # relaunch. Turning it back on means provisioning a profile and adding
      # `keychain-access-groups` first; see the entitlements file.
      - name: Verify release entitlements
        run: |
          ENTITLEMENTS='Priority/Priority.release.entitlements'
          read_key() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$ENTITLEMENTS" 2>/dev/null || echo missing
          }

          sandbox=$(read_key com.apple.security.app-sandbox)
          if [ "$sandbox" != "false" ]; then
            echo "::error::$ENTITLEMENTS re-enables the app sandbox (got: $sandbox)."
            echo "::error::That breaks keychain access without a provisioning profile."
            exit 1
          fi

          # The build setting is what actually decides this — an earlier attempt
          # to unsandbox by editing the plist alone changed nothing, because
          # Xcode synthesises entitlements from ENABLE_APP_SANDBOX.
          if grep -q 'ENABLE_APP_SANDBOX = YES' 'Priority.xcodeproj/project.pbxproj'; then
            echo "::error::ENABLE_APP_SANDBOX is YES in project.pbxproj, which overrides the plist."
            exit 1
          fi

          # Kept true so that re-enabling the sandbox one day doesn't silently
          # drop capabilities the app needs — notably the OAuth loopback
          # listener, which `GoogleOAuthLoopbackReceiver` cannot bind without
          # network.server.
          for key in \
            com.apple.security.network.client \
            com.apple.security.network.server \
            com.apple.security.files.user-selected.read-write
          do
            value=$(read_key "$key")
            if [ "$value" != "true" ]; then
              echo "::error::$ENTITLEMENTS is missing or disables $key (got: $value)"
              exit 1
            fi
          done
          echo "Release entitlements OK"

  # The CLI is a separate cargo crate sharing no code with the Swift targets, so
  # it gets its own job. `mcp-parity` below is what actually holds it to the
  # same behaviour as the other two MCP servers.
  cli:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml

  # Priority ships three implementations of the same MCP server and a client
  # may be pointed at any of them, so a tool that answers differently in one is
  # a capability the assistant appears to lose depending on how it was wired up.
  # Needs a Debug build and the CLI binary; reads no real data and needs no
  # credentials.
  mcp-parity:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build app (Debug)
        run: |
          xcodebuild -project 'Priority.xcodeproj' \
            -scheme 'Priority' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build the CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Compare all three MCP servers
        run: python3 scripts/mcp_parity_check.py
